version: "3"
services:
  mi-scale:
    build: ../../
    security_opt:
      - no-new-privileges:true
    read_only: true
    privileged: true
    # cap_add:
    #   - NET_ADMIN
    #   - NET_RAW
    volumes:
      - ./xiaomi_mi_scale_options.json:/data/options.json:ro
      - /var/run/dbus/:/var/run/dbus/:ro #needed for bleak
    networks:
      mqtt:

  mosquitto:
    image: docker.io/library/eclipse-mosquitto:2.0.18@sha256:d12c8f80dfc65b768bb9acecc7ef182b976f71fb681640b66358e5e0cf94e9e9
    volumes:
      - "./mosquitto.conf:/mosquitto/config/mosquitto.conf:rw"
    networks:
      mqtt:

networks:
  mqtt:
