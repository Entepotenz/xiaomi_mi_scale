[tool.poetry]
name = "xiaomi-mi-scale"
version = "0.3.5"
description = "Connector for Xiaomi Mi Scale"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
bleak = "3.0.2"
paho-mqtt = "2.1.0"

[tool.poetry.group.dev.dependencies]
black = "26.3.1"
flake8 = "7.3.0"
pytest = "^9.0"
pytest-cov = "^7.1.0"
ruff = "^0.15.12"
mypy = "^2.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
